<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | WANDERWISE AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563EB',
                        'primary-hover': '#1D4ED8',
                        'bg-soft': '#F8FAFC',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        /* Grid background pattern */
        .bg-grid-pattern {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, #e2e8f0 1px, transparent 1px),
                              linear-gradient(to bottom, #e2e8f0 1px, transparent 1px);
        }
        
        /* Floating label inputs */
        .floating-input:focus + .floating-label,
        .floating-input:not(:placeholder-shown) + .floating-label {
            transform: translateY(-50%) scale(0.85);
            top: 0;
            background-color: white;
            padding: 0 4px;
            color: #2563EB;
        }
    </style>
</head>
<body class="bg-bg-soft text-slate-900 min-h-screen flex items-center justify-center relative overflow-hidden bg-grid-pattern">

    <!-- Gradient Blurs -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute -top-32 -left-32 w-96 h-96 bg-blue-100 rounded-full mix-blend-multiply filter blur-3xl opacity-70"></div>
        <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-blue-50 rounded-full mix-blend-multiply filter blur-3xl opacity-70"></div>
    </div>

    <!-- Auth Card -->
    <div class="bg-white rounded-3xl shadow-xl w-full max-w-md p-8 md:p-10 border border-slate-100 relative">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-primary tracking-tight mb-2">WANDERWISE AI</h1>
            <h2 class="text-3xl font-extrabold text-slate-900 mb-2">Welcome back!</h2>
            <p class="text-slate-500 text-sm">Welcome to all your friendly!</p>
        </div>

        <!-- Tabs -->
        <div class="flex border-b border-slate-200 mb-6">
            <button id="tabLogin" onclick="switchTab('login')" class="w-1/2 pb-3 text-center font-semibold text-primary border-b-2 border-primary transition-colors">
                Log In
            </button>
            <button id="tabSignup" onclick="switchTab('signup')" class="w-1/2 pb-3 text-center font-medium text-slate-400 hover:text-slate-600 transition-colors">
                Sign Up
            </button>
        </div>

        <!-- Form -->
        <form class="space-y-5" onsubmit="event.preventDefault(); window.location.href='/auth/mock';">
            
            <div id="nameField" class="space-y-1 relative hidden">
                <label class="text-sm font-medium text-slate-700 ml-1">Full Name</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </div>
                    <input type="text" placeholder="Full Name" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all placeholder-slate-400 text-slate-800">
                </div>
            </div>

            <div class="space-y-1 relative">
                <label class="text-sm font-medium text-slate-700 ml-1">Email Address</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    </div>
                    <input type="email" placeholder="Email Address" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all placeholder-slate-400 text-slate-800" required>
                </div>
            </div>

            <div class="space-y-1 relative">
                <label class="text-sm font-medium text-slate-700 ml-1">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    </div>
                    <input type="password" placeholder="Password" class="w-full pl-10 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all placeholder-slate-400 text-slate-800" required>
                </div>
            </div>

            <!-- Fake login for demo purposes -->
            <button type="submit" id="submitBtn" class="w-full py-3.5 bg-primary hover:bg-primary-hover text-white rounded-xl font-semibold shadow-md hover:shadow-lg transition-all duration-200 relative overflow-hidden group">
                <span class="relative z-10" id="submitText">Sign In</span>
                <div class="absolute inset-0 h-full w-full bg-white/20 scale-x-0 group-hover:scale-x-100 transition-transform origin-left rounded-xl duration-300"></div>
            </button>
        </form>

        <!-- Divider -->
        <div class="flex items-center my-6">
            <div class="flex-grow border-t border-slate-200"></div>
            <span class="mx-4 text-xs text-slate-400 font-medium">or continue with</span>
            <div class="flex-grow border-t border-slate-200"></div>
        </div>

        <!-- Social Buttons -->
        <div class="grid grid-cols-2 gap-4">
            
            <!-- Real Google Auth embedded inside a styled button -->
            <div class="relative w-full h-12 flex items-center justify-center border border-slate-200 rounded-xl hover:bg-slate-50 transition-colors cursor-pointer overflow-hidden">
                <div class="absolute inset-0 opacity-0 z-20">
                    <div id="g_id_onload" data-client_id="{{ google_client_id }}" data-ux_mode="redirect" data-login_uri="http://localhost:8000/auth/google" data-auto_prompt="false"></div>
                    <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="continue_with" data-shape="rectangular" data-logo_alignment="left"></div>
                </div>
                <!-- Styled fake logo behind the real invisible iframe button -->
                <svg class="w-5 h-5 z-10" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            </div>

            <!-- Apple Auth (Fake) -->
            <button class="w-full h-12 flex items-center justify-center border border-slate-200 rounded-xl hover:bg-slate-50 transition-colors">
                <svg class="w-5 h-5 text-black" fill="currentColor" viewBox="0 0 24 24"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.04 2.26-.74 3.58-.8 1.83-.07 3.25.79 4.12 2.05-3.52 2.07-2.95 6.94.51 8.35-.74 1.8-1.57 3.32-3.29 2.57zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.02 4.41-3.74 4.25z"/></svg>
            </button>
        </div>

        <div class="text-center mt-8 text-sm">
            <span id="footerText" class="text-slate-500">New to WanderWise?</span>
            <a href="#" onclick="switchTab(document.getElementById('nameField').classList.contains('hidden') ? 'signup' : 'login')" id="footerLink" class="text-primary font-medium hover:underline ml-1">Sign up</a>
        </div>

    </div>

    <script>
        function switchTab(tab) {
            const tabLogin = document.getElementById('tabLogin');
            const tabSignup = document.getElementById('tabSignup');
            const nameField = document.getElementById('nameField');
            const submitText = document.getElementById('submitText');
            const footerText = document.getElementById('footerText');
            const footerLink = document.getElementById('footerLink');

            if (tab === 'login') {
                tabLogin.className = "w-1/2 pb-3 text-center font-semibold text-primary border-b-2 border-primary transition-colors";
                tabSignup.className = "w-1/2 pb-3 text-center font-medium text-slate-400 hover:text-slate-600 transition-colors border-b-2 border-transparent";
                nameField.classList.add('hidden');
                submitText.innerText = "Sign In";
                footerText.innerText = "New to WanderWise?";
                footerLink.innerText = "Sign up";
            } else {
                tabSignup.className = "w-1/2 pb-3 text-center font-semibold text-primary border-b-2 border-primary transition-colors";
                tabLogin.className = "w-1/2 pb-3 text-center font-medium text-slate-400 hover:text-slate-600 transition-colors border-b-2 border-transparent";
                nameField.classList.remove('hidden');
                submitText.innerText = "Create Account";
                footerText.innerText = "Already have an account?";
                footerLink.innerText = "Log in";
            }
        }
    </script>
</body>
</html>
